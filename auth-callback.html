  <style>
    body {
      min-height: 100vh;
      margin: 0;
      background:
        radial-gradient(circle at top left, rgba(255, 124, 0, 0.18), transparent 24%),
        radial-gradient(circle at bottom right, rgba(68, 190, 233, 0.16), transparent 26%),
        var(--kc-background-dark);
    }
    .kc-callback-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    .kc-callback-card {
      width: min(520px, 100%);
      border-radius: 24px;
      background: rgba(13, 18, 26, 0.82);
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 26px 80px rgba(0,0,0,0.28);
      backdrop-filter: blur(16px);
      padding: 32px 28px;
      display: grid;
      gap: 18px;
      text-align: center;
    }
    .kc-callback-logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 1.6rem;
      font-weight: 900;
      color: var(--kc-text-dark-primary);
    }
    .kc-callback-logo span { color: var(--kc-primary-brand); }
    .kc-callback-icon {
      width: 84px;
      height: 84px;
      margin: 0 auto;
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      background: rgba(255,255,255,0.04);
      color: var(--kc-text-dark-primary);
    }
    .kc-callback-icon.loading {
      color: #5ec8ff;
      background: rgba(94, 200, 255, 0.10);
    }
    .kc-callback-icon.success {
      color: #59d487;
      background: rgba(89, 212, 135, 0.12);
    }
    .kc-callback-icon.warn {
      color: #ffce56;
      background: rgba(255, 206, 86, 0.12);
    }
    .kc-callback-icon.error {
      color: #ff7b7b;
      background: rgba(255, 123, 123, 0.12);
    }
    .kc-callback-title {
      margin: 0;
      font-size: clamp(1.5rem, 3vw, 2rem);
      line-height: 1.08;
      color: var(--kc-text-dark-primary);
    }
    .kc-callback-msg {
      margin: 0;
      color: var(--kc-text-dark-secondary);
      line-height: 1.7;
    }
    .kc-callback-progress {
      display: none;
      height: 6px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      overflow: hidden;
    }
    .kc-callback-progress.visible { display: block; }
    .kc-callback-progress-bar {
      width: 0;
      height: 100%;
      background: linear-gradient(90deg, #ff7c00, #4ac9ff);
      transition: width .2s linear;
    }
    .kc-callback-cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: fit-content;
      margin: 0 auto;
      padding: 13px 20px;
      border-radius: 14px;
      text-decoration: none;
      font-weight: 800;
      background: linear-gradient(135deg, #ff7c00, #ff9a3a);
      color: #fff;
      box-shadow: 0 18px 34px rgba(255, 124, 0, 0.22);
    }
    .kc-callback-countdown {
      margin: 0;
      color: var(--kc-text-dark-secondary);
      font-size: .88rem;
    }
    .kc-callback-reset {
      display: none;
      gap: 12px;
      text-align: left;
      padding-top: 4px;
    }
    .kc-callback-reset label {
      display: grid;
      gap: 8px;
      color: var(--kc-text-dark-primary);
      font-weight: 700;
      font-size: .9rem;
    }
    .kc-callback-reset input {
      width: 100%;
      box-sizing: border-box;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(6, 10, 16, 0.72);
      color: var(--kc-text-dark-primary);
      padding: 13px 14px;
      font: inherit;
    }
    .kc-callback-reset button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: none;
      border-radius: 14px;
      padding: 13px 18px;
      font-weight: 800;
      cursor: pointer;
      background: linear-gradient(135deg, #ff7c00, #ff9a3a);
      color: #fff;
    }
    .kc-callback-footer {
      color: var(--kc-text-dark-secondary);
      font-size: .84rem;
    }
    .kc-callback-footer a {
      color: var(--kc-primary-brand);
      text-decoration: none;
      font-weight: 700;
    }
  </style>

<body class="kc-shell-page kc-auth-callback-route">
  <a href="#kc-main" class="kc-skip-link">Pular para o conteúdo principal</a>
  <header class="kc-header">
    <div class="kc-header-container">
      <div class="kc-logo">
        <a href="index.html" aria-label="KinoCampus - Comunidade UFG" data-i18n-aria-label="aria-label.brand-home">
          <span aria-hidden="true" class="kc-logo-mark"><i class="fas fa-campground"></i></span>
          <span class="kc-logo-text">
            <span class="kc-logo-name">Kino<span>Campus</span></span>
            <span class="kc-logo-sub">Comunidade UFG</span>
          </span>
        </a>
      </div>
      <div class="kc-user-actions">
        <button class="kc-notif-bell" id="kcNotifBell" aria-label="Notificações" data-i18n-aria-label="aria-label.notifications-bell" style="display:none;"><i class="fas fa-bell"></i><span class="kc-notif-badge" id="kcNotifBadge" style="display:none;">0</span></button>
        <button class="theme-toggle" title="Alternar tema" data-i18n-tooltip="tooltip.theme-toggle" aria-label="Alternar tema claro/escuro" data-i18n-aria-label="aria-label.theme-toggle"><i class="fas fa-sun"></i></button>
        <a class="btn-login" href="#login">Login/Cadastro</a>
      </div>
    </div>
  </header>
  <main class="kc-main-content" id="kc-main">
    <div class="kc-callback-page">
      <div class="kc-callback-card">
      <div class="kc-callback-logo">
        <i class="fas fa-campground" aria-hidden="true"></i>
        <span>Kino</span>Campus
      </div>

      <div class="kc-callback-icon loading" id="cbIcon">
        <i class="fas fa-spinner fa-spin" id="cbIconInner"></i>
      </div>

      <h1 class="kc-callback-title" id="cbTitle">Conferindo seu link...</h1>
      <p class="kc-callback-msg" id="cbMsg">Estamos finalizando sua autenticacao no KinoCampus.</p>

      <div class="kc-callback-progress" id="cbProgress">
        <div class="kc-callback-progress-bar" id="cbProgressBar"></div>
      </div>

      <form id="cbResetForm" class="kc-callback-reset" autocomplete="on">
        <label for="cbResetPassword">
          Nova senha
          <input id="cbResetPassword" type="password" minlength="6" autocomplete="new-password" placeholder="Minimo de 6 caracteres" data-i18n-placeholder="placeholder.password-min" />
        </label>
        <label for="cbResetConfirm">
          Confirmar nova senha
          <input id="cbResetConfirm" type="password" minlength="6" autocomplete="new-password" placeholder="Repita a senha" data-i18n-placeholder="placeholder.password-repeat" />
        </label>
        <button type="submit">
          <i class="fas fa-key"></i>
          <span>Salvar nova senha</span>
        </button>
      </form>

      <a id="cbBtn" class="kc-callback-cta" href="/index.html" style="display:none;"></a>
      <p id="cbCountdown" class="kc-callback-countdown" style="display:none;"></p>

      <div class="kc-callback-footer">
        KinoCampus · Comunidade UFG · <a href="index.html">Voltar ao inicio</a>
      </div>
      </div>
    </div>
  </main>
