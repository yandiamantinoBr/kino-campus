name: Pitch Validation

on:
  pull_request:
    branches:
      - kinocampus-V75.0-foundations
    paths:
      - 'apps/pitch-institucional/**'
      - 'apresentacao-institucional.html'
      - 'assets/css/kc-pitch-host.css'
      - 'assets/js/features/kc-pitch-host.js'
      - 'tests/integration/kc-pitch-*.test.js'
      - '.github/scripts/apply-pitch-source-fix.mjs'
      - '.github/workflows/pitch-validation.yml'
  push:
    branches:
      - kinocampus-V75.0-foundations
    paths:
      - 'apps/pitch-institucional/**'
      - 'apresentacao-institucional.html'
      - 'assets/css/kc-pitch-host.css'
      - 'assets/js/features/kc-pitch-host.js'
      - 'tests/integration/kc-pitch-*.test.js'
      - '.github/workflows/pitch-validation.yml'

permissions:
  contents: write

concurrency:
  group: pitch-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrate-source:
    name: Apply direct React state migration
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/pitch-navigation-projection-2026-07-21'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply migration once
        shell: bash
        run: |
          if [[ ! -f .github/scripts/apply-pitch-source-fix.mjs ]]; then
            echo "Direct state migration already applied."
            exit 0
          fi

          node .github/scripts/apply-pitch-source-fix.mjs
          rm -f .github/scripts/apply-pitch-source-fix.mjs
          rm -f .github/workflows/apply-pitch-source-fix.yml
          rm -f apps/pitch-institucional/app/pitch-runtime-guard.tsx

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(pitch): move navigation authority into React state"
          git push origin HEAD:${{ github.head_ref }}

  app:
    name: App lint, build and rendered HTML
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/pitch-institucional

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install locked dependencies
        run: npm run install:ci

      - name: Lint
        run: npm run lint

      - name: Build and validate rendered HTML
        shell: bash
        run: |
          set +e
          npm test > "${RUNNER_TEMP}/pitch-validation.log" 2>&1
          status=$?
          tail -n 120 "${RUNNER_TEMP}/pitch-validation.log"
          exit "$status"

      - name: Upload pitch validation log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pitch-validation-log
          path: ${{ runner.temp }}/pitch-validation.log
          retention-days: 7
          if-no-files-found: ignore

  contracts:
    name: Host and runtime Jest contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Run pitch contracts
        run: >-
          npx jest
          tests/integration/kc-pitch-host.test.js
          tests/integration/kc-pitch-runtime-guard.test.js
          --runInBand

  browser:
    name: Chromium — 6 modes, stale session and mobile
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install pitch dependencies
        working-directory: apps/pitch-institucional
        run: npm run install:ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start pitch development server
        shell: bash
        run: |
          pushd apps/pitch-institucional >/dev/null
          nohup npm run dev -- --host 127.0.0.1 --port 4173 > "${RUNNER_TEMP}/pitch-dev.log" 2>&1 &
          echo $! > "${RUNNER_TEMP}/pitch-dev.pid"
          popd >/dev/null
          for attempt in $(seq 1 90); do
            if curl --fail --silent --show-error http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          tail -n 160 "${RUNNER_TEMP}/pitch-dev.log" || true
          exit 1

      - name: Run browser smoke
        shell: bash
        env:
          PITCH_BASE_URL: http://127.0.0.1:4173
        run: |
          set +e
          node apps/pitch-institucional/tests/browser-smoke.mjs > "${RUNNER_TEMP}/pitch-browser.log" 2>&1
          status=$?
          cat "${RUNNER_TEMP}/pitch-browser.log"
          exit "$status"

      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pitch-browser-diagnostics
          path: |
            ${{ runner.temp }}/pitch-dev.log
            ${{ runner.temp }}/pitch-browser.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Stop pitch development server
        if: always()
        shell: bash
        run: |
          if [[ -f "${RUNNER_TEMP}/pitch-dev.pid" ]]; then
            kill "$(cat "${RUNNER_TEMP}/pitch-dev.pid")" 2>/dev/null || true
          fi
