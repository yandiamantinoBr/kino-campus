# One-shot: configure Supabase Auth custom SMTP (Hostinger) + branded email templates
# Runs via workflow_dispatch on this branch. Uses SUPABASE_ACCESS_TOKEN (repo secret).
# Never prints the token. Verifies only success/failure of each step.
name: Configure Auth SMTP + Templates

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure custom SMTP (Hostinger)
        env:
          SB_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SMTP_PASS: ${{ secrets.SMTP_SENDER_PASS }}
        run: |
          REF="wacyrkwhkvzwkqpolrbg"
          PAYLOAD=$(jq -n \
            --arg host "smtp.hostinger.com" \
            --argjson port 465 \
            --arg user "contato@kinocampus.com.br" \
            --arg pass "$SMTP_PASS" \
            --arg sender "contato@kinocampus.com.br" \
            --arg name "KinoCampus" \
            '{smtp_host: $host, smtp_port: $port, smtp_user: $user, smtp_pass: $pass, smtp_sender_email: $sender, smtp_sender_name: $name, smtp_ignore_tls: false, smtp_max_frequency: 60}')
          HTTP=$(curl -sS -o /tmp/auth-cfg.json -w "%{http_code}" -X PATCH \
            "https://api.supabase.com/v1/projects/$REF/config/auth" \
            -H "Authorization: Bearer $SB_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")
          echo "auth smtp PATCH -> HTTP $HTTP"
          test "$HTTP" = "200" || { cat /tmp/auth-cfg.json; exit 1; }

      - name: Install branded signup template
        env:
          SB_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          REF="wacyrkwhkvzwkqpolrbg"
          BODY=$(python3 -c "import json;print(json.dumps(open('supabase/templates/kino-auth-email-template.html').read()))")
          PAYLOAD="{\"subject\": \"Confirme seu e-mail \u2014 KinoCampus\", \"body\": $BODY}"
          HTTP=$(curl -sS -o /tmp/tpl.json -w "%{http_code}" -X PATCH \
            "https://api.supabase.com/v1/projects/$REF/config/auth/templates/signup" \
            -H "Authorization: Bearer $SB_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")
          echo "signup template PATCH -> HTTP $HTTP"
          test "$HTTP" = "200" || { cat /tmp/tpl.json; exit 1; }

      - name: Install branded invite template
        env:
          SB_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          REF="wacyrkwhkvzwkqpolrbg"
          BODY=$(python3 -c "import json;print(json.dumps(open('supabase/templates/kino-auth-email-template.html').read()))")
          PAYLOAD="{\"subject\": \"Voc\u00ea foi convidado para a KinoCampus\", \"body\": $BODY}"
          HTTP=$(curl -sS -o /tmp/tpl2.json -w "%{http_code}" -X PATCH \
            "https://api.supabase.com/v1/projects/$REF/config/auth/templates/invite" \
            -H "Authorization: Bearer $SB_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")
          echo "invite template PATCH -> HTTP $HTTP"
          test "$HTTP" = "200" || { cat /tmp/tpl2.json; exit 1; }

      - name: Install branded recovery template
        env:
          SB_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          REF="wacyrkwhkvzwkqpolrbg"
          BODY=$(python3 -c "import json;print(json.dumps(open('supabase/templates/kino-auth-email-template.html').read()))")
          PAYLOAD="{\"subject\": \"Redefinir sua senha \u2014 KinoCampus\", \"body\": $BODY}"
          HTTP=$(curl -sS -o /tmp/tpl3.json -w "%{http_code}" -X PATCH \
            "https://api.supabase.com/v1/projects/$REF/config/auth/templates/recovery" \
            -H "Authorization: Bearer $SB_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")
          echo "recovery template PATCH -> HTTP $HTTP"
          test "$HTTP" = "200" || { cat /tmp/tpl3.json; exit 1; }

      - name: Verify SMTP config applied
        env:
          SB_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          REF="wacyrkwhkvzwkqpolrbg"
          curl -sS "https://api.supabase.com/v1/projects/$REF/config/auth" \
            -H "Authorization: Bearer $SB_TOKEN" > /tmp/verify.json
          jq '{smtp_host, smtp_port, smtp_sender_email, smtp_sender_name, site_url, uri_allow_list, mailer_otp_exp}' /tmp/verify.json
