# One-shot: configure Supabase Auth custom SMTP (Hostinger) + branded email templates
# Runs via workflow_dispatch on this branch. Uses SUPABASE_ACCESS_TOKEN (repo secret).
# Never prints the token. Verifies only success/failure of each step.
name: Configure Auth SMTP + Templates

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure custom SMTP (Hostinger)
        env:
          SB_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SMTP_PASS: ${{ secrets.SMTP_SENDER_PASS }}
        run: |
          REF="wacyrkwhkvzwkqpolrbg"
          PAYLOAD=$(jq -n \
            --arg host "smtp.hostinger.com" \
            --argjson port 465 \
            --arg user "contato@kinocampus.com.br" \
            --arg pass "$SMTP_PASS" \
            --arg sender "contato@kinocampus.com.br" \
            --arg name "KinoCampus" \
            '{smtp_host: $host, smtp_port: ($port | tostring), smtp_user: $user, smtp_pass: $pass, smtp_sender_email: $sender, smtp_sender_name: $name, smtp_ignore_tls: false, smtp_max_frequency: 60}')
          HTTP=$(curl -sS -o /tmp/auth-cfg.json -w "%{http_code}" -X PATCH \
            "https://api.supabase.com/v1/projects/$REF/config/auth" \
            -H "Authorization: Bearer $SB_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")
          echo "auth smtp PATCH -> HTTP $HTTP"
          if [ "$HTTP" != "200" ]; then echo "::warning::smtp config PATCH returned $HTTP (may already be configured)"; cat /tmp/auth-cfg.json; fi

      - name: Install branded templates (signup / invite / recovery)
        env:
          SB_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          REF="wacyrkwhkvzwkqpolrbg"
          # 1. GET current config and list mailer_* keys (schema probe)
          curl -sS "https://api.supabase.com/v1/projects/$REF/config/auth" \
            -H "Authorization: Bearer $SB_TOKEN" > /tmp/auth-cfg-now.json
          jq "keys | map(select(startswith(\"mailer_\")))" /tmp/auth-cfg-now.json || true
          # 2. PATCH templates + subjects via mailer_templates_* / mailer_subjects_* fields
          python3 - <<PYEOF
          import json
          tpl = open("supabase/templates/kino-auth-email-template.html").read()
          cfg = json.load(open("/tmp/auth-cfg-now.json"))
          payload = {}
          for key in ("smtp_host","smtp_port","smtp_user","smtp_pass","smtp_sender_email","smtp_sender_name","smtp_max_frequency","smtp_ignore_tls"):
              if key in cfg: payload[key] = cfg[key]
          payload["mailer_subjects_confirmation"] = "Confirme seu e-mail \u2014 KinoCampus"
          payload["mailer_subjects_invite"] = "Voc\u00ea foi convidado para a KinoCampus"
          payload["mailer_subjects_recovery"] = "Redefinir sua senha \u2014 KinoCampus"
          payload["mailer_templates_confirmation_content"] = tpl
          payload["mailer_templates_invite_content"] = tpl
          payload["mailer_templates_recovery_content"] = tpl
          open("/tmp/auth-patch.json","w").write(json.dumps(payload))
          PYEOF
          HTTP=$(curl -sS -o /tmp/auth-patch-res.json -w "%{http_code}" -X PATCH \
            "https://api.supabase.com/v1/projects/$REF/config/auth" \
            -H "Authorization: Bearer $SB_TOKEN" \
            -H "Content-Type: application/json" \
            -d @/tmp/auth-patch.json)
          echo "templates PATCH -> HTTP $HTTP"
          if [ "$HTTP" != "200" ]; then head -c 500 /tmp/auth-patch-res.json; fi
          # 3. verify: the confirmation template must contain the tent SVG path
          curl -sS "https://api.supabase.com/v1/projects/$REF/config/auth" \
            -H "Authorization: Bearer $SB_TOKEN" > /tmp/auth-cfg-after.json
          jq -r ".mailer_templates_confirmation_content" /tmp/auth-cfg-after.json | grep -c "M12 3.2" || echo "LOGO-MISSING"

      - name: Verify SMTP config applied
        env:
          SB_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          REF="wacyrkwhkvzwkqpolrbg"
          curl -sS "https://api.supabase.com/v1/projects/$REF/config/auth" \
            -H "Authorization: Bearer $SB_TOKEN" > /tmp/verify.json
          jq '{smtp_host, smtp_port, smtp_sender_email, smtp_sender_name, site_url, uri_allow_list, mailer_otp_exp}' /tmp/verify.json
