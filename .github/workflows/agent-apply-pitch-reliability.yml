name: Apply pitch navigation reliability patch

on:
  push:
    branches:
      - fix/pitch-navigation-reliability-2026-07-21
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    name: Patch, validate and commit
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Apply guarded source patch
        run: node scripts/agent-apply-pitch-reliability-fix.mjs

      - name: Remove temporary patch automation
        run: |
          rm -f scripts/agent-apply-pitch-reliability-fix.mjs
          rm -f .github/workflows/agent-apply-pitch-reliability.yml

      - name: Check patch whitespace
        run: git diff --check

      - name: Install pitch dependencies
        working-directory: apps/pitch-institucional
        run: npm ci

      - name: Lint pitch source
        working-directory: apps/pitch-institucional
        run: npm run lint

      - name: Build and test pitch
        working-directory: apps/pitch-institucional
        run: npm test

      - name: Install root dependencies
        run: npm ci

      - name: Validate root contracts
        run: |
          npm run check:version
          npm run check:structure
          npm run check:scripts
          npm run check:routes
          npm run check:hygiene
          npm run check:search-registry
          npm test -- --runInBand tests/integration/kc-pitch-host.test.js

      - name: Commit and push validated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(pitch): stabilize navigation and projection controls"
          git push origin HEAD
