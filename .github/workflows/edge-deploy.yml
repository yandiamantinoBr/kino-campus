# GitHub Actions — Auto-deploy Edge Functions on push
#
# Runs after Essential Validation succeeds for a base-branch push.
# Pull requests never deploy Edge Functions.
# 2026-07-08: created because we discovered Edge Function v11 was running OLD code from
# 2026-05 while commits to supabase/functions/cadu-publish/ were not deployed. This was
# the root cause of "literal ..." and "UFG —" prefix reaching production.

name: Deploy Edge Functions

on:
  workflow_run:
    workflows: [Essential Validation]
    branches: [main]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: kino-campus-production-edge-deploy
  cancel-in-progress: false

jobs:
  detect-changes:
    name: Validate local function inventory
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has_candidates: ${{ steps.detect.outputs.has_candidates }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 50
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Validate all Edge Functions from the approved SHA
        id: detect
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          list_all_functions() {
            find supabase/functions -mindepth 1 -maxdepth 1 -type d ! -name _shared \
              -printf '%f\n' | sort
          }

          if ! [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid validated commit SHA: $HEAD_SHA" >&2
            exit 1
          fi

          # workflow_run does not expose the complete before..after range of the
          # original push. Keep the complete local inventory as candidates; the
          # next job compares each candidate with the source running remotely.
          CHANGED=$(list_all_functions | paste -sd, -)
          if [ -z "$CHANGED" ]; then
            echo 'No Edge Function directories found.' >&2
            exit 1
          fi

          echo "Functions selected from validated SHA $HEAD_SHA: $CHANGED"
          for fn in $(echo "$CHANGED" | tr ',' ' '); do
            if ! [[ "$fn" =~ ^[a-z0-9_-]+$ ]]; then
              echo "Invalid Edge Function directory name: $fn" >&2
              exit 1
            fi
            if [ ! -d "supabase/functions/$fn" ]; then
              echo "Edge Function '$fn' was removed. Remote deletion requires an explicit manual operation." >&2
              exit 1
            fi
            if [ ! -s "supabase/functions/$fn/index.ts" ]; then
              echo "Edge Function '$fn' has no non-empty index.ts entrypoint." >&2
              exit 1
            fi
          done
          echo 'has_candidates=true' >> "$GITHUB_OUTPUT"

  source-drift:
    name: Compare validated source with production
    needs: detect-changes
    if: needs.detect-changes.outputs.has_candidates == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    outputs:
      matrix: ${{ steps.compare.outputs.matrix }}
      has_changes: ${{ steps.compare.outputs.has_changes }}
      names: ${{ steps.compare.outputs.names }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.105.0

      - name: Download the current production sources
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          REMOTE_DIR="$RUNNER_TEMP/kc-edge-remote"
          mkdir -p "$REMOTE_DIR/supabase/functions"
          supabase functions download \
            --project-ref wacyrkwhkvzwkqpolrbg \
            --use-api \
            --workdir "$REMOTE_DIR"

      - name: Select only functions with source drift
        id: compare
        run: |
          REMOTE_DIR="$RUNNER_TEMP/kc-edge-remote"
          DRIFT_FILE="$RUNNER_TEMP/kc-edge-drifted.txt"
          SYNCED_FILE="$RUNNER_TEMP/kc-edge-synced.txt"
          REMOTE_ONLY_FILE="$RUNNER_TEMP/kc-edge-remote-only.txt"
          : > "$DRIFT_FILE"
          : > "$SYNCED_FILE"
          : > "$REMOTE_ONLY_FILE"

          while IFS= read -r fn; do
            RESULT=$(node scripts/compare-edge-function-source.js \
              --local-root "$GITHUB_WORKSPACE" \
              --remote-root "$REMOTE_DIR" \
              --function "$fn")
            echo "$RESULT"
            DRIFT=$(RESULT="$RESULT" node -e '
              const result = JSON.parse(process.env.RESULT);
              process.stdout.write(result.drift === true ? "true" : "false");
            ')
            if [ "$DRIFT" = 'true' ]; then
              echo "$fn" >> "$DRIFT_FILE"
            else
              echo "$fn" >> "$SYNCED_FILE"
            fi
          done < <(
            find supabase/functions -mindepth 1 -maxdepth 1 -type d ! -name _shared \
              -printf '%f\n' | sort
          )

          while IFS= read -r fn; do
            if [ ! -d "supabase/functions/$fn" ]; then
              echo "$fn" >> "$REMOTE_ONLY_FILE"
            fi
          done < <(
            find "$REMOTE_DIR/supabase/functions" \
              -mindepth 1 -maxdepth 1 -type d ! -name _shared \
              -printf '%f\n' | sort
          )

          DRIFT_FILE="$DRIFT_FILE" \
            SYNCED_FILE="$SYNCED_FILE" \
            REMOTE_ONLY_FILE="$REMOTE_ONLY_FILE" \
            python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          def read_names(env_name):
              return [
                  name.strip()
                  for name in Path(os.environ[env_name]).read_text(
                      encoding="utf-8"
                  ).splitlines()
                  if name.strip()
              ]

          drifted = read_names("DRIFT_FILE")
          synced = read_names("SYNCED_FILE")
          remote_only = read_names("REMOTE_ONLY_FILE")
          matrix = {"include": [{"function": name} for name in drifted]}
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(
                  "matrix="
                  + json.dumps(matrix, separators=(",", ":"))
                  + "\n"
              )
              output.write(f"has_changes={'true' if drifted else 'false'}\n")
              output.write("names=" + ",".join(drifted) + "\n")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("### Edge Function source drift\n\n")
              summary.write(f"- Divergent or not yet deployed: {len(drifted)}\n")
              summary.write(f"- Already synchronized: {len(synced)}\n")
              summary.write(f"- Present only in production: {len(remote_only)}\n")
              if drifted:
                  summary.write("- Selected: `" + "`, `".join(drifted) + "`\n")
              else:
                  summary.write("- No production deployment is necessary.\n")
              if remote_only:
                  message = (
                      "Remote-only functions require explicit review and are not deleted: "
                      + ", ".join(remote_only)
                  )
                  print("::warning title=Remote-only Edge Functions::" + message)
                  summary.write("- Remote-only: `" + "`, `".join(remote_only) + "`\n")
          PY

  preflight:
    name: Verify production prerequisites
    needs: source-drift
    if: needs.source-drift.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.105.0

      - name: Link exact production project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase link --project-ref wacyrkwhkvzwkqpolrbg
          test "$(tr -d '\r\n' < supabase/.temp/project-ref)" = "wacyrkwhkvzwkqpolrbg"

      - name: Verify required migrations are already applied
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          RESPONSE=$(curl --fail-with-body --retry 3 --retry-all-errors -sS \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            'https://api.supabase.com/v1/projects/wacyrkwhkvzwkqpolrbg/database/migrations')
          RESPONSE="$RESPONSE" python3 - <<'PY'
          import json
          import os
          import re

          required = {
              "20260728183022",
              "20260728184500",
              "20260728185000",
              "20260728210000",
              "20260728220000",
              "20260728230000",
              "20260728231500",
              "20260728233000",
              "20260728234000",
              "20260728235000",
              "20260729000000",
              "20260729001000",
              "20260729003000",
              "20260729004000",
              "20260729005000",
              "20260729006000",
              "20260729007000",
              "20260729008000",
              "20260729009000",
              "20260729011000",
              "20260729012000",
              "20260729172316",
              "20260729190653",
              "20260729203000",
              "20260731193000",
              "20260801183000",
          }
          payload = json.loads(os.environ["RESPONSE"])

          if isinstance(payload, list):
              rows = payload
          elif isinstance(payload, dict):
              rows = []
              for key in ("result", "data", "migrations", "rows"):
                  candidate = payload.get(key)
                  if isinstance(candidate, list):
                      rows = candidate
                      break
              if not rows and "version" in payload:
                  rows = [payload]
          else:
              rows = []

          present = {
              str(row["version"])
              for row in rows
              if isinstance(row, dict)
              and isinstance(row.get("version"), (str, int))
              and re.fullmatch(r"[0-9]{14}", str(row["version"]))
          }
          missing = sorted(required - present)
          if missing:
              raise SystemExit(
                  "Required migrations must be applied before Edge deploy; missing: "
                  + ", ".join(missing)
              )
          print("Required migration history is present.")
          PY

      - name: Verify canonical privacy schema contract
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: wacyrkwhkvzwkqpolrbg
        run: |
          POSTGREST_RESPONSE=$(curl --fail-with-body --retry 3 --retry-all-errors -sS \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/postgrest")
          POSTGREST_RESPONSE="$POSTGREST_RESPONSE" python3 - <<'PY'
          import json
          import os

          payload = json.loads(os.environ["POSTGREST_RESPONSE"])
          if not isinstance(payload, dict):
              raise SystemExit("PostgREST config returned an unexpected response")
          exposed = {
              item.strip()
              for item in str(payload.get("db_schema", "")).split(",")
              if item.strip()
          }
          extra_path = {
              item.strip()
              for item in str(payload.get("db_extra_search_path", "")).split(",")
              if item.strip()
          }
          forbidden = {"net", "vault"}
          leaked = sorted(forbidden & (exposed | extra_path))
          if leaked:
              raise SystemExit(
                  "Sensitive schemas must not be exposed by PostgREST: "
                  + ", ".join(leaked)
              )
          print("Sensitive schemas are absent from PostgREST exposure.")
          PY

          test -s scripts/verify-privacy-schema.sql
          QUERY_FILE="$(mktemp)"
          RESPONSE_BODY="$(mktemp)"
          trap 'rm -f "$QUERY_FILE" "$RESPONSE_BODY"' EXIT
          PROJECT_REF="$PROJECT_REF" QUERY_FILE="$QUERY_FILE" python3 - <<'PY'
          import os
          from pathlib import Path

          placeholder = "__KC_EXPECTED_PROJECT_REF__"
          query = Path("scripts/verify-privacy-schema.sql").read_text(
              encoding="utf-8"
          )
          if query.count(placeholder) != 1:
              raise SystemExit(
                  "Privacy schema gate must contain one project-ref placeholder"
              )
          query = query.replace(placeholder, os.environ["PROJECT_REF"])
          query = "begin transaction read only;\n" + query + "\ncommit;\n"
          Path(os.environ["QUERY_FILE"]).write_text(query, encoding="utf-8")
          print(
              "Prepared explicit read-only privacy schema transaction "
              f"({len(query.encode('utf-8'))} bytes)."
          )
          PY

          supabase db query --linked \
            --file "$QUERY_FILE" \
            --output json > "$RESPONSE_BODY"
          RESPONSE_BODY="$RESPONSE_BODY" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(
              Path(os.environ["RESPONSE_BODY"]).read_text(encoding="utf-8")
          )
          if isinstance(payload, dict):
              rows = payload.get("result") or payload.get("data") or payload.get("rows") or []
          elif isinstance(payload, list):
              rows = payload
          else:
              rows = []
          if len(rows) != 1 or not isinstance(rows[0], dict):
              raise SystemExit("Privacy schema gate returned an unexpected response")
          non_boolean = sorted(
              name for name, available in rows[0].items()
              if not isinstance(available, bool)
          )
          if non_boolean:
              raise SystemExit(
                  "Privacy schema gate returned non-boolean capabilities: "
                  + ", ".join(non_boolean)
              )
          operational_capabilities = {
              "data_export_retention_schedule_configured",
          }
          structural_missing = sorted(
              name for name, available in rows[0].items()
              if available is not True and name not in operational_capabilities
          )
          if structural_missing:
              raise SystemExit(
                  "Privacy schema prerequisites are incomplete: "
                  + ", ".join(structural_missing)
              )
          operational_missing = sorted(
              name for name in operational_capabilities
              if rows[0].get(name) is not True
          )
          if operational_missing:
              message = (
                  "Edge code remains deployable, but these runtime automations "
                  "remain fail-closed: " + ", ".join(operational_missing)
              )
              print("::warning title=Operational privacy readiness::" + message)
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
                  summary.write("### Operational privacy readiness\n\n")
                  summary.write("- Warning: " + message + "\n")
          else:
              print("Canonical privacy schema and operational prerequisites are present.")
          PY

      - name: Report runtime secret readiness without reading values
        if: ${{ !cancelled() }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DRIFTED_FUNCTIONS: ${{ needs.source-drift.outputs.names }}
        run: |
          SECRET_JSON=$(supabase secrets list \
            --project-ref wacyrkwhkvzwkqpolrbg \
            --output json)
          SECRET_JSON="$SECRET_JSON" python3 - <<'PY'
          import json
          import os

          required_by_function = {
              "kc-account-erasure": {
                  "KC_ERASURE_OUTBOX_ENCRYPTION_KEY_B64",
                  "KC_SMTP_PASS",
                  "KC_SMTP_USER",
              },
              "kc-analytics-subject-id": {"KC_ANALYTICS_ID_SECRET"},
              "kc-create-privacy-help-guest": {
                  "KC_PRIVACY_HELP_ALLOWED_ORIGINS",
                  "KC_TURNSTILE_ENVIRONMENT",
                  "KC_TURNSTILE_EXPECTED_HOSTNAMES",
                  "KC_TURNSTILE_SECRET_KEY",
              },
              "kc-data-export-retention": {"KC_DATA_EXPORT_RETENTION_SECRET"},
              "kc-dispatch-notification-outbox": {"KC_NOTIFICATION_DISPATCH_SECRET"},
              "kc-external-access-decide": {"KC_SMTP_PASS", "KC_SMTP_USER"},
              "kc-ga4-reports": {"KC_GA4_PROPERTY_ID", "KC_GA4_SA_KEY"},
              "kc-help-request-notify": {"KC_SMTP_PASS", "KC_SMTP_USER"},
              "kc-search-console-reports": {
                  "KC_SEARCH_CONSOLE_SA_KEY",
                  "KC_SEARCH_CONSOLE_SITE_URL",
              },
              "notify-admin-reports-threshold": {
                  "ADMIN_REPORTS_WEBHOOK_URL",
                  "KC_APP_BASE_URL",
                  "KC_NOTIFY_HMAC_SECRET",
              },
          }
          rows = json.loads(os.environ["SECRET_JSON"])
          if not isinstance(rows, list):
              raise SystemExit("Supabase secret inventory returned an unexpected response")
          present = {
              str(row.get("name", "")).strip()
              for row in rows
              if isinstance(row, dict)
          }
          selected = {
              name.strip()
              for name in os.environ.get("DRIFTED_FUNCTIONS", "").split(",")
              if name.strip()
          }
          missing_by_function = {
              function_name: sorted(required_by_function.get(function_name, set()) - present)
              for function_name in sorted(selected)
          }
          missing_by_function = {
              function_name: missing
              for function_name, missing in missing_by_function.items()
              if missing
          }

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("### Edge runtime secret readiness\n\n")
              if not missing_by_function:
                  summary.write("- Selected functions have all declared runtime secret names.\n")
              for function_name, missing in missing_by_function.items():
                  message = (
                      function_name
                      + " will remain fail-closed until these secret names exist: "
                      + ", ".join(missing)
                  )
                  print("::warning title=Edge runtime degraded::" + message)
                  summary.write("- `" + function_name + "`: missing `" + "`, `".join(missing) + "`\n")
          print("Runtime secret names were inventoried; values were not read.")
          PY

  deploy:
    name: Deploy ${{ matrix.function }}
    needs: [source-drift, preflight]
    if: needs.source-drift.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    strategy:
      matrix: ${{ fromJson(needs.source-drift.outputs.matrix) }}
      fail-fast: false
      max-parallel: 3
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.105.0

      - name: Link project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase link --project-ref wacyrkwhkvzwkqpolrbg

      - name: Deploy edge function ${{ matrix.function }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          echo "Deploying ${{ matrix.function }}..."
          supabase functions deploy ${{ matrix.function }} \
            --project-ref wacyrkwhkvzwkqpolrbg

      - name: Verify deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          sleep 5
          EXPECTED_VERIFY_JWT=$(python3 - '${{ matrix.function }}' <<'PY'
          import sys
          import tomllib

          with open('supabase/config.toml', 'rb') as handle:
              config = tomllib.load(handle)
          function_config = config.get('functions', {}).get(sys.argv[1], {})
          print(str(function_config.get('verify_jwt', True)).lower())
          PY
          )

          DEPLOYMENT_JSON=$(curl --fail-with-body --retry 3 --retry-all-errors -sS \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/wacyrkwhkvzwkqpolrbg/functions/${{ matrix.function }}")

          DETAILS=$(printf '%s' "$DEPLOYMENT_JSON" | python3 -c '
          import json, sys
          payload = json.load(sys.stdin)
          version = payload.get("version")
          status = payload.get("status")
          verify_jwt = payload.get("verify_jwt")
          if not isinstance(version, int) or not isinstance(status, str) or not isinstance(verify_jwt, bool):
              raise SystemExit("Management API returned an incomplete Edge Function deployment")
          print(f"{version}\t{status}\t{str(verify_jwt).lower()}")
          ')
          IFS=$'\t' read -r VERSION STATUS ACTUAL_VERIFY_JWT <<< "$DETAILS"

          if [ "$STATUS" != 'ACTIVE' ]; then
            echo "Deployment is not active: status=$STATUS" >&2
            exit 1
          fi
          if [ "$ACTUAL_VERIFY_JWT" != "$EXPECTED_VERIFY_JWT" ]; then
            echo "JWT verification drift: expected=$EXPECTED_VERIFY_JWT actual=$ACTUAL_VERIFY_JWT" >&2
            exit 1
          fi

          echo "Deployed ${{ matrix.function }} version=$VERSION status=$STATUS verify_jwt=$ACTUAL_VERIFY_JWT"

          VERIFY_DIR="$RUNNER_TEMP/kc-edge-deployed-${{ matrix.function }}"
          SOURCE_MATCHED=false
          for ATTEMPT in 1 2 3; do
            rm -rf "$VERIFY_DIR"
            mkdir -p "$VERIFY_DIR/supabase/functions"
            if supabase functions download '${{ matrix.function }}' \
              --project-ref wacyrkwhkvzwkqpolrbg \
              --use-api \
              --workdir "$VERIFY_DIR" && \
              node scripts/compare-edge-function-source.js \
                --local-root "$GITHUB_WORKSPACE" \
                --remote-root "$VERIFY_DIR" \
                --function '${{ matrix.function }}' \
                --check; then
              SOURCE_MATCHED=true
              break
            fi
            echo "Remote source has not converged (attempt $ATTEMPT/3)." >&2
            sleep $((ATTEMPT * 5))
          done
          if [ "$SOURCE_MATCHED" != 'true' ]; then
            echo 'Remote source does not match the validated source after deploy.' >&2
            exit 1
          fi
          echo 'Verified deployed source and reachable shared dependencies.'

          if [ "${{ matrix.function }}" = 'kc-account-erasure' ]; then
            DEPLOYED_SOURCE="$VERIFY_DIR/supabase/functions/kc-account-erasure/index.ts"
            if [ -z "$DEPLOYED_SOURCE" ] || [ ! -s "$DEPLOYED_SOURCE" ]; then
              echo 'Could not read back deployed kc-account-erasure source.' >&2
              exit 1
            fi
            grep -F \
              '"kc-account-erasure-2026-08-01-v1"' \
              "$DEPLOYED_SOURCE" >/dev/null
            echo 'Verified deployed account-erasure contract marker from remote source.'
          fi
