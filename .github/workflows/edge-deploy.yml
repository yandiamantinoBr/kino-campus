# GitHub Actions — Auto-deploy Edge Functions on push
#
# Runs after Essential Validation succeeds for a base-branch push.
# Pull requests never deploy Edge Functions.
# 2026-07-08: created because we discovered Edge Function v11 was running OLD code from
# 2026-05 while commits to supabase/functions/cadu-publish/ were not deployed. This was
# the root cause of "literal ..." and "UFG —" prefix reaching production.

name: Deploy Edge Functions

on:
  workflow_run:
    workflows: [Essential Validation]
    branches: [kinocampus-V75.0-foundations]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: kino-campus-production-edge-deploy
  cancel-in-progress: false

jobs:
  detect-changes:
    name: Prepare complete function matrix
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      has_changes: ${{ steps.detect.outputs.has_changes }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 50
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Select all edge functions from the validated SHA
        id: detect
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          list_all_functions() {
            find supabase/functions -mindepth 1 -maxdepth 1 -type d ! -name _shared \
              -printf '%f\n' | sort
          }

          if ! [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid validated commit SHA: $HEAD_SHA" >&2
            exit 1
          fi

          # workflow_run does not expose the complete before..after range of the
          # original push. Rebuild every function so multi-commit pushes and a
          # later CI-fix commit cannot strand older function changes undeployed.
          CHANGED=$(list_all_functions | paste -sd, -)
          if [ -z "$CHANGED" ]; then
            echo 'No Edge Function directories found.' >&2
            exit 1
          fi

          echo "Functions selected from validated SHA $HEAD_SHA: $CHANGED"
          MATRIX=""
          for fn in $(echo "$CHANGED" | tr ',' ' '); do
            if ! [[ "$fn" =~ ^[a-z0-9_-]+$ ]]; then
              echo "Invalid Edge Function directory name: $fn" >&2
              exit 1
            fi
            if [ ! -d "supabase/functions/$fn" ]; then
              echo "Edge Function '$fn' was removed. Remote deletion requires an explicit manual operation." >&2
              exit 1
            fi
            MATRIX="${MATRIX}{\"function\":\"$fn\"},"
          done
          MATRIX="${MATRIX%,}"
          echo "matrix={\"include\":[${MATRIX}]}" >> "$GITHUB_OUTPUT"
          echo 'has_changes=true' >> "$GITHUB_OUTPUT"

  preflight:
    name: Verify production prerequisites
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.105.0

      - name: Link exact production project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase link --project-ref wacyrkwhkvzwkqpolrbg
          test "$(tr -d '\r\n' < supabase/.temp/project-ref)" = "wacyrkwhkvzwkqpolrbg"

      - name: Verify required migrations are already applied
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          RESPONSE=$(curl --fail-with-body --retry 3 --retry-all-errors -sS \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            'https://api.supabase.com/v1/projects/wacyrkwhkvzwkqpolrbg/database/migrations')
          RESPONSE="$RESPONSE" python3 - <<'PY'
          import json
          import os
          import re

          required = {
              "20260728183022",
              "20260728184500",
              "20260728185000",
              "20260728210000",
              "20260728220000",
              "20260728230000",
              "20260728231500",
              "20260728233000",
              "20260728234000",
              "20260728235000",
              "20260729000000",
              "20260729001000",
              "20260729003000",
              "20260729004000",
              "20260729005000",
              "20260729006000",
              "20260729007000",
              "20260729008000",
              "20260729009000",
              "20260729011000",
              "20260729012000",
              "20260729172316",
              "20260729190653",
              "20260729203000",
          }
          payload = json.loads(os.environ["RESPONSE"])

          if isinstance(payload, list):
              rows = payload
          elif isinstance(payload, dict):
              rows = []
              for key in ("result", "data", "migrations", "rows"):
                  candidate = payload.get(key)
                  if isinstance(candidate, list):
                      rows = candidate
                      break
              if not rows and "version" in payload:
                  rows = [payload]
          else:
              rows = []

          present = {
              str(row["version"])
              for row in rows
              if isinstance(row, dict)
              and isinstance(row.get("version"), (str, int))
              and re.fullmatch(r"[0-9]{14}", str(row["version"]))
          }
          missing = sorted(required - present)
          if missing:
              raise SystemExit(
                  "Required migrations must be applied before Edge deploy; missing: "
                  + ", ".join(missing)
              )
          print("Required migration history is present.")
          PY

      - name: Verify canonical privacy schema contract
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: wacyrkwhkvzwkqpolrbg
        run: |
          POSTGREST_RESPONSE=$(curl --fail-with-body --retry 3 --retry-all-errors -sS \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/postgrest")
          POSTGREST_RESPONSE="$POSTGREST_RESPONSE" python3 - <<'PY'
          import json
          import os

          payload = json.loads(os.environ["POSTGREST_RESPONSE"])
          if not isinstance(payload, dict):
              raise SystemExit("PostgREST config returned an unexpected response")
          exposed = {
              item.strip()
              for item in str(payload.get("db_schema", "")).split(",")
              if item.strip()
          }
          extra_path = {
              item.strip()
              for item in str(payload.get("db_extra_search_path", "")).split(",")
              if item.strip()
          }
          forbidden = {"net", "vault"}
          leaked = sorted(forbidden & (exposed | extra_path))
          if leaked:
              raise SystemExit(
                  "Sensitive schemas must not be exposed by PostgREST: "
                  + ", ".join(leaked)
              )
          print("Sensitive schemas are absent from PostgREST exposure.")
          PY

          test -s scripts/verify-privacy-schema.sql
          QUERY=$(python3 - <<'PY'
          import os
          from pathlib import Path

          placeholder = "__KC_EXPECTED_PROJECT_REF__"
          query = Path("scripts/verify-privacy-schema.sql").read_text(
              encoding="utf-8"
          )
          if query.count(placeholder) != 1:
              raise SystemExit(
                  "Privacy schema gate must contain one project-ref placeholder"
              )
          print(query.replace(placeholder, os.environ["PROJECT_REF"]))
          PY
          )
          REQUEST_BODY=$(QUERY="$QUERY" python3 - <<'PY'
          import json
          import os

          print(json.dumps({
              "query": os.environ["QUERY"],
              "parameters": [],
          }))
          PY
          )
          RESPONSE=$(curl --fail-with-body --retry 3 --retry-all-errors -sS \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H 'Content-Type: application/json' \
            --data "$REQUEST_BODY" \
            'https://api.supabase.com/v1/projects/wacyrkwhkvzwkqpolrbg/database/query/read-only')
          RESPONSE="$RESPONSE" python3 - <<'PY'
          import json
          import os

          payload = json.loads(os.environ["RESPONSE"])
          if isinstance(payload, dict):
              rows = payload.get("result") or payload.get("data") or payload.get("rows") or []
          elif isinstance(payload, list):
              rows = payload
          else:
              rows = []
          if len(rows) != 1 or not isinstance(rows[0], dict):
              raise SystemExit("Privacy schema gate returned an unexpected response")
          non_boolean = sorted(
              name for name, available in rows[0].items()
              if not isinstance(available, bool)
          )
          if non_boolean:
              raise SystemExit(
                  "Privacy schema gate returned non-boolean capabilities: "
                  + ", ".join(non_boolean)
              )
          missing = sorted(
              name for name, available in rows[0].items()
              if available is not True
          )
          if missing:
              raise SystemExit(
                  "Privacy schema prerequisites are incomplete: "
                  + ", ".join(missing)
              )
          print("Canonical privacy schema prerequisites are present.")
          PY

      - name: Verify required secret names without reading values
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          SECRET_JSON=$(supabase secrets list \
            --project-ref wacyrkwhkvzwkqpolrbg \
            --output json)
          SECRET_JSON="$SECRET_JSON" python3 - <<'PY'
          import json
          import os

          required = {
              "ADMIN_REPORTS_WEBHOOK_URL",
              "KC_ANALYTICS_ID_SECRET",
              "KC_APP_BASE_URL",
              "KC_DATA_EXPORT_RETENTION_SECRET",
              "KC_ERASURE_OUTBOX_ENCRYPTION_KEY_B64",
              "KC_GA4_PROPERTY_ID",
              "KC_GA4_SA_KEY",
              "KC_NOTIFY_HMAC_SECRET",
              "KC_PRIVACY_HELP_ALLOWED_ORIGINS",
              "KC_SEARCH_CONSOLE_SA_KEY",
              "KC_SEARCH_CONSOLE_SITE_URL",
              "KC_SMTP_PASS",
              "KC_SMTP_USER",
              "KC_TURNSTILE_ENVIRONMENT",
              "KC_TURNSTILE_EXPECTED_HOSTNAMES",
              "KC_TURNSTILE_SECRET_KEY",
          }
          rows = json.loads(os.environ["SECRET_JSON"])
          if not isinstance(rows, list):
              raise SystemExit("Supabase secret inventory returned an unexpected response")
          present = {
              str(row.get("name", "")).strip()
              for row in rows
              if isinstance(row, dict)
          }
          missing = sorted(required - present)
          if missing:
              raise SystemExit(
                  "Required Edge Function secret names are absent: "
                  + ", ".join(missing)
              )
          print("Required secret names are present; values were not read.")
          PY

  deploy:
    name: Deploy ${{ matrix.function }}
    needs: [detect-changes, preflight]
    if: needs.detect-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    strategy:
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
      fail-fast: false
      max-parallel: 3
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.105.0

      - name: Link project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase link --project-ref wacyrkwhkvzwkqpolrbg

      - name: Deploy edge function ${{ matrix.function }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          echo "Deploying ${{ matrix.function }}..."
          supabase functions deploy ${{ matrix.function }} \
            --project-ref wacyrkwhkvzwkqpolrbg

      - name: Verify deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          sleep 5
          EXPECTED_VERIFY_JWT=$(python3 - '${{ matrix.function }}' <<'PY'
          import sys
          import tomllib

          with open('supabase/config.toml', 'rb') as handle:
              config = tomllib.load(handle)
          function_config = config.get('functions', {}).get(sys.argv[1], {})
          print(str(function_config.get('verify_jwt', True)).lower())
          PY
          )

          DEPLOYMENT_JSON=$(curl --fail-with-body --retry 3 --retry-all-errors -sS \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/wacyrkwhkvzwkqpolrbg/functions/${{ matrix.function }}")

          DETAILS=$(printf '%s' "$DEPLOYMENT_JSON" | python3 -c '
          import json, sys
          payload = json.load(sys.stdin)
          version = payload.get("version")
          status = payload.get("status")
          verify_jwt = payload.get("verify_jwt")
          if not isinstance(version, int) or not isinstance(status, str) or not isinstance(verify_jwt, bool):
              raise SystemExit("Management API returned an incomplete Edge Function deployment")
          print(f"{version}\t{status}\t{str(verify_jwt).lower()}")
          ')
          IFS=$'\t' read -r VERSION STATUS ACTUAL_VERIFY_JWT <<< "$DETAILS"

          if [ "$STATUS" != 'ACTIVE' ]; then
            echo "Deployment is not active: status=$STATUS" >&2
            exit 1
          fi
          if [ "$ACTUAL_VERIFY_JWT" != "$EXPECTED_VERIFY_JWT" ]; then
            echo "JWT verification drift: expected=$EXPECTED_VERIFY_JWT actual=$ACTUAL_VERIFY_JWT" >&2
            exit 1
          fi

          echo "Deployed ${{ matrix.function }} version=$VERSION status=$STATUS verify_jwt=$ACTUAL_VERIFY_JWT"
