# GitHub Actions — Auto-deploy Edge Functions on push
#
# Runs after Essential Validation succeeds for a base-branch push.
# Pull requests never deploy Edge Functions.
# 2026-07-08: created because we discovered Edge Function v11 was running OLD code from
# 2026-05 while commits to supabase/functions/cadu-publish/ were not deployed. This was
# the root cause of "literal ..." and "UFG —" prefix reaching production.

name: Deploy Edge Functions

on:
  workflow_run:
    workflows: [Essential Validation]
    branches: [kinocampus-V75.0-foundations]
    types: [completed]
  workflow_dispatch:
    inputs:
      function_name:
        description: 'Edge function name to deploy (empty = all)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  detect-changes:
    name: Detect changed functions
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      has_changes: ${{ steps.detect.outputs.has_changes }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 50
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Detect changed edge functions
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_FUNCTION: ${{ inputs.function_name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          list_all_functions() {
            find supabase/functions -mindepth 1 -maxdepth 1 -type d ! -name _shared \
              -printf '%f\n' | sort
          }

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            REQUESTED="$REQUESTED_FUNCTION"
            if [ -n "$REQUESTED" ]; then
              if ! [[ "$REQUESTED" =~ ^[a-z0-9_-]+$ ]] || [ ! -d "supabase/functions/$REQUESTED" ]; then
                echo "Invalid Edge Function name: $REQUESTED" >&2
                exit 1
              fi
              CHANGED="$REQUESTED"
            else
              CHANGED=$(list_all_functions | paste -sd, -)
            fi
          else
            if ! [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Invalid validated commit SHA: $HEAD_SHA" >&2
              exit 1
            fi

            CHANGED_FILES=$(git diff --name-only "${HEAD_SHA}^" "$HEAD_SHA")
            if grep -Eq '^supabase/functions/_shared/|^supabase/functions/[^/]+$' <<< "$CHANGED_FILES"; then
              echo 'Shared Edge Function code or configuration changed; all functions must be rebuilt.'
              CHANGED=$(list_all_functions | paste -sd, -)
            else
              CONFIG_FUNCTIONS=""
              if grep -Fxq 'supabase/config.toml' <<< "$CHANGED_FILES"; then
                BEFORE_CONFIG="$RUNNER_TEMP/supabase-config-before.toml"
                git show "${HEAD_SHA}^:supabase/config.toml" > "$BEFORE_CONFIG"
                CONFIG_FUNCTIONS=$(python3 - "$BEFORE_CONFIG" 'supabase/config.toml' <<'PY'
          import sys
          import tomllib

          def read_functions(path):
              with open(path, "rb") as handle:
                  return tomllib.load(handle).get("functions", {})

          before = read_functions(sys.argv[1])
          after = read_functions(sys.argv[2])
          for name in sorted(set(before) | set(after)):
              if before.get(name) != after.get(name):
                  print(name)
          PY
                )
              fi

              CHANGED=$({
                awk -F/ \
                  '$1 == "supabase" && $2 == "functions" && $3 != "_shared" { print $3 }' \
                  <<< "$CHANGED_FILES"
                printf '%s\n' "$CONFIG_FUNCTIONS"
              } | sed '/^$/d' | sort -u | paste -sd, -)
            fi
          fi

          if [ -z "$CHANGED" ]; then
            echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
            echo 'has_changes=false' >> "$GITHUB_OUTPUT"
            echo 'No Edge Function changes detected.'
            exit 0
          fi

          echo "Changed functions: $CHANGED"
          MATRIX=""
          for fn in $(echo "$CHANGED" | tr ',' ' '); do
            if ! [[ "$fn" =~ ^[a-z0-9_-]+$ ]]; then
              echo "Invalid Edge Function directory name: $fn" >&2
              exit 1
            fi
            if [ ! -d "supabase/functions/$fn" ]; then
              echo "Edge Function '$fn' was removed. Remote deletion requires an explicit manual operation." >&2
              exit 1
            fi
            MATRIX="${MATRIX}{\"function\":\"$fn\"},"
          done
          MATRIX="${MATRIX%,}"
          echo "matrix={\"include\":[${MATRIX}]}" >> "$GITHUB_OUTPUT"
          echo 'has_changes=true' >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy ${{ matrix.function }}
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v1
        with:
          version: 2.105.0

      - name: Link project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase link --project-ref wacyrkwhkvzwkqpolrbg

      - name: Deploy edge function ${{ matrix.function }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          echo "Deploying ${{ matrix.function }}..."
          supabase functions deploy ${{ matrix.function }} \
            --project-ref wacyrkwhkvzwkqpolrbg

      - name: Verify deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          sleep 5
          EXPECTED_VERIFY_JWT=$(python3 - '${{ matrix.function }}' <<'PY'
          import sys
          import tomllib

          with open('supabase/config.toml', 'rb') as handle:
              config = tomllib.load(handle)
          function_config = config.get('functions', {}).get(sys.argv[1], {})
          print(str(function_config.get('verify_jwt', True)).lower())
          PY
          )

          DEPLOYMENT_JSON=$(curl --fail-with-body --retry 3 --retry-all-errors -sS \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/wacyrkwhkvzwkqpolrbg/functions/${{ matrix.function }}")

          DETAILS=$(printf '%s' "$DEPLOYMENT_JSON" | python3 -c '
          import json, sys
          payload = json.load(sys.stdin)
          version = payload.get("version")
          status = payload.get("status")
          verify_jwt = payload.get("verify_jwt")
          if not isinstance(version, int) or not isinstance(status, str) or not isinstance(verify_jwt, bool):
              raise SystemExit("Management API returned an incomplete Edge Function deployment")
          print(f"{version}\t{status}\t{str(verify_jwt).lower()}")
          ')
          IFS=$'\t' read -r VERSION STATUS ACTUAL_VERIFY_JWT <<< "$DETAILS"

          if [ "$STATUS" != 'ACTIVE' ]; then
            echo "Deployment is not active: status=$STATUS" >&2
            exit 1
          fi
          if [ "$ACTUAL_VERIFY_JWT" != "$EXPECTED_VERIFY_JWT" ]; then
            echo "JWT verification drift: expected=$EXPECTED_VERIFY_JWT actual=$ACTUAL_VERIFY_JWT" >&2
            exit 1
          fi

          echo "Deployed ${{ matrix.function }} version=$VERSION status=$STATUS verify_jwt=$ACTUAL_VERIFY_JWT"
