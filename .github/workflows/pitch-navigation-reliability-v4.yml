name: Pitch Navigation Reliability V4

on:
  push:
    branches:
      - fix/pitch-navigation-reliability-v4-2026-07-21
    paths:
      - scripts/apply-pitch-navigation-v4.mjs
      - .github/workflows/pitch-navigation-reliability-v4.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pitch-navigation-reliability-v4
  cancel-in-progress: false

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FIX_BRANCH: fix/pitch-navigation-reliability-v4-2026-07-21
    steps:
      - name: Check out the isolated fix branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.FIX_BRANCH }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/pitch-institucional/package-lock.json

      - name: Apply the deterministic patch
        run: |
          set -euo pipefail
          test -f scripts/apply-pitch-navigation-v4.mjs
          node scripts/apply-pitch-navigation-v4.mjs
          test -f apps/pitch-institucional/app/presentation-sync.ts
          grep -q 'reconcilePresenterSlide' apps/pitch-institucional/app/page.tsx
          grep -q 'ZoomIn size={18}' apps/pitch-institucional/app/page.tsx
          test -f apps/pitch-institucional/tests/presentation-behavior.test.mjs

      - name: Remove temporary automation and probes
        run: |
          rm -f scripts/apply-pitch-navigation-v4.mjs
          rm -f .github/workflows/pitch-navigation-reliability-v4.yml
          rm -f .github/.pitch-connector-probe*

      - name: Enforce the patch boundary
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only | sort)"
          printf '%s\n' "$changed"
          forbidden="$(printf '%s\n' "$changed" | grep -Ev '^(apps/pitch-institucional/(app/(page\.tsx|globals\.css|presentation-sync\.ts)|tests/presentation-behavior\.test\.mjs|package\.json)|scripts/apply-pitch-navigation-v4\.mjs|\.github/workflows/pitch-navigation-reliability-v4\.yml|\.github/\.pitch-connector-probe.*)$' || true)"
          if [ -n "$forbidden" ]; then
            echo 'Unexpected files changed:'
            echo "$forbidden"
            exit 1
          fi

      - name: Validate the institutional presentation app
        working-directory: apps/pitch-institucional
        run: |
          npm ci
          npm run lint
          npm test

      - name: Validate the Kino Campus host integration
        run: |
          npm ci
          npm run validate:js
          npm run validate:html
          npm run validate:inline
          node --test tests/integration/kc-pitch-host.test.js

      - name: Commit and push validated changes
        run: |
          set -euo pipefail
          git config user.name 'Kino Campus Reliability Agent'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No source changes were produced.'
            exit 1
          fi
          git commit -m 'fix(pitch): stabilize navigation and projection controls'
          git push origin HEAD:${FIX_BRANCH}
