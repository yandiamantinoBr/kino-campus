name: Apply Pitch Source Fix

on:
  push:
    branches:
      - fix/pitch-navigation-projection-2026-07-21
    paths:
      - '.github/scripts/apply-pitch-source-fix.mjs'
      - '.github/workflows/apply-pitch-source-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: fix/pitch-navigation-projection-2026-07-21
          fetch-depth: 0

      - name: Apply direct source-state migration
        run: node .github/scripts/apply-pitch-source-fix.mjs

      - name: Remove temporary migration and superseded runtime guard
        run: |
          rm .github/scripts/apply-pitch-source-fix.mjs
          rm apps/pitch-institucional/app/pitch-runtime-guard.tsx

      - name: Commit source correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(pitch): move navigation authority into React state"
          git push origin HEAD:fix/pitch-navigation-projection-2026-07-21
