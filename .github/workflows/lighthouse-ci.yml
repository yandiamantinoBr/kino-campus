# Lighthouse CI — KinoCampus v12.10.0
#
# Executa em todo PR para a branch base do projeto.
# Audita 4 páginas representativas e bloqueia (error) se a11y < 0.90.
# Performance, Best Practices e SEO são reportados como warn.

name: Lighthouse CI

on:
  pull_request:
    branches:
      - kinocampus-V75.0-foundations

jobs:
  lighthouse:
    name: Lighthouse audit (4 páginas)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Executar Lighthouse CI
        run: npx lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
