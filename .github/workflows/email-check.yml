# GitHub Actions — E-mail deliverability checks
#
# Roda diariamente + em todo PR para fornecer o status obrigatório da main.
# Quebra o build se DNS/Supabase Auth perderem configuração crítica.

name: Email deliverability

on:
  pull_request:
    branches: [main]
  schedule:
    # Daily 06:00 UTC (~03:00 BRT) - detecta drift em config de DNS/Auth
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dns-checks:
    name: DNS + Supabase Auth
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Run email deliverability test
        env:
          KINOCAMPUS_SUPABASE_ANON_KEY: ${{ secrets.KINOCAMPUS_SUPABASE_ANON_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        # Allow run without secrets (DNS-only mode) but exit non-zero if real issue
        run: node tests/test-email-deliverability.js
        continue-on-error: false
