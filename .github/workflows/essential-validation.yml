# Essential Validation - KinoCampus v75.1
#
# Runs the repository's non-deploy gates on pull requests before review/merge.

name: Essential Validation

on:
  pull_request:
    branches:
      - kinocampus-V75.0-foundations
  push:
    branches:
      - kinocampus-V75.0-foundations

permissions:
  contents: read

concurrency:
  group: essential-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validators, Jest and Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Version map
        run: npm run check:version

      - name: Repository structure
        run: npm run check:structure

      - name: Script chains
        run: npm run check:scripts

      - name: Public routes
        run: npm run check:routes

      - name: Hygiene
        run: npm run check:hygiene

      - name: Search registry snapshot
        run: npm run check:search-registry

      - name: Jest
        run: npm test -- --runInBand

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright E2E (chromium)
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: output/playwright-report
          retention-days: 7

  database-contracts:
    name: Supabase reset, lint and pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1
        with:
          version: 2.105.0

      - name: Start local Supabase
        run: supabase start

      - name: Rebuild schema from active migrations
        run: supabase db reset --local --no-seed

      - name: Lint database functions
        run: supabase db lint --local --level error --fail-on error

      - name: Run pgTAP contracts
        run: supabase test db --local supabase/tests

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup

  edge-functions:
    name: Edge Functions type-check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Deno 2.8.0
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.8.0

      - name: Type-check every Edge Function
        shell: bash
        run: |
          shopt -s nullglob
          entrypoints=(supabase/functions/*/index.ts)
          if [ "${#entrypoints[@]}" -eq 0 ]; then
            echo 'No Edge Function entrypoints found.' >&2
            exit 1
          fi

          for entrypoint in "${entrypoints[@]}"; do
            config="$(dirname "$entrypoint")/deno.json"
            if [ -f "$config" ]; then
              deno check --no-lock --node-modules-dir=none --config "$config" "$entrypoint"
            else
              deno check --no-lock --node-modules-dir=none "$entrypoint"
            fi
          done

      - name: Run Edge Function unit tests
        shell: bash
        run: |
          mapfile -t test_files < <(find supabase/functions -type f \( -name '*_test.ts' -o -name '*.test.ts' \) -print | sort)
          if [ "${#test_files[@]}" -eq 0 ]; then
            echo 'No Edge Function unit tests found.'
            exit 0
          fi

          deno test --no-lock --node-modules-dir=none "${test_files[@]}"
