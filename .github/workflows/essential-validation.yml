# Essential Validation - KinoCampus v75.1
#
# Runs the repository's non-deploy gates on pull requests before review/merge.

name: Essential Validation

on:
  pull_request:
    branches:
      - kinocampus-V75.0-foundations
  push:
    branches:
      - kinocampus-V75.0-foundations

permissions:
  contents: read

concurrency:
  group: essential-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validators, Jest and Playwright list
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Version map
        run: npm run check:version

      - name: Repository structure
        run: npm run check:structure

      - name: Script chains
        run: npm run check:scripts

      - name: Public routes
        run: npm run check:routes

      - name: Hygiene
        run: npm run check:hygiene

      - name: Jest
        run: npm test -- --runInBand

      - name: Playwright inventory
        run: npx playwright test --list
