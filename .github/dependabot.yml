version: 2

updates:
  - package-ecosystem: npm
    directory: /
    target-branch: kinocampus-V75.0-foundations
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    versioning-strategy: increase-if-necessary
    groups:
      jest-toolchain:
        patterns:
          - jest
          - jest-*
          - "@jest/*"
          - babel-jest
        update-types:
          - major
          - minor
          - patch
      babel-toolchain:
        patterns:
          - "@babel/core"
          - "@babel/preset-env"
        update-types:
          - major
          - minor
          - patch
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    target-branch: kinocampus-V75.0-foundations
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci(deps)
